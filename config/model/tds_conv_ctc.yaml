# @package _global_
module:
  _target_: emg2qwerty.lightning.TransformerModule
  in_features: 528  # freq * channels = (n_fft // 2 + 1) * 16
  mlp_features: [384, 256]
  transformer_embed_dim: 256
  transformer_num_heads: 8
  transformer_layers: 6
  transformer_drop_prob: 0.1
  transformer_max_len: 4096
  transformer_dim_feedforward: 1024
  block_channels: [24, 24, 24, 24] # Unused in transformer architecture; kept for compatibility
  kernel_width: 32  # Unused in transformer architecture; kept for compatibility

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000  # 4 sec windows for 2kHz EMG
  padding: [1800, 200]  # 900ms past context, 100ms future context
