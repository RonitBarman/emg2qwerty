# @package _global_
module:
  _target_: emg2qwerty.lightning.LSTMCTCModule
  in_features: 528  # freq * channels = (n_fft // 2 + 1) * 16
  mlp_features: [256]
  hidden_size: 256
  num_lstm_layers: 2
  bidirectional: True
  fc_features: 256
  dropout: 0.3

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000  # 4 sec windows for 2kHz EMG
  padding: [0, 0]  # LSTM handles full sequence, no conv padding needed
